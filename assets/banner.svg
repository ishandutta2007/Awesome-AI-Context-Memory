<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="sub-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow-cyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glow-purple" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".25" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes floatSlow{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.02)}}@keyframes pulseGlow{0%{opacity:.35}50%{opacity:.75}}@keyframes streamFlow{0%{stroke-dashoffset:200}}@keyframes orbitCard{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}.title{font-weight:800;font-size:46px;letter-spacing:-.5px}.pill-text,.subtitle,.tagline,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle{font-weight:500;font-size:19px;letter-spacing:.2px}.pill-text,.tagline{font-weight:600}.tagline{font-size:14px;letter-spacing:1.5px;text-transform:uppercase}.pill-text{font-size:13px}.floating-orb{animation:pulseGlow 4s ease-in-out infinite alternate}.stream-line{stroke-dasharray:10,15;animation:streamFlow 5s linear infinite}.badge-float,.badge-float-delayed{animation:orbitCard 4s ease-in-out infinite}.badge-float-delayed{animation-delay:2s}</style></defs><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><circle cx="150" cy="80" r="140" fill="#38bdf8" class="floating-orb" filter="url(#glow-cyan)" opacity=".12"/><circle cx="1050" cy="180" r="180" fill="#a855f7" class="floating-orb" filter="url(#glow-purple)" opacity=".12"/><circle cx="600" cy="330" r="160" fill="#6366f1" class="floating-orb" filter="url(#glow-cyan)" opacity=".1"/><path fill="none" stroke="#38bdf8" stroke-width="1.8" d="M 50 180 Q 300 80, 600 180 T 1150 180" class="stream-line" opacity=".3"/><path fill="none" stroke="#c084fc" stroke-width="1.8" d="M 50 220 Q 350 320, 650 200 T 1150 220" class="stream-line" opacity=".25" style="animation-direction:reverse;animation-duration:7s"/><g opacity=".4"><circle cx="100" cy="190" r="4" fill="#38bdf8"/><circle cx="280" cy="130" r="3" fill="#818cf8"/><circle cx="920" cy="150" r="3" fill="#c084fc"/><circle cx="1100" cy="210" r="4" fill="#38bdf8"/></g><g text-anchor="middle" transform="translate(600, 75)"><rect width="280" height="28" x="-140" y="-35" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity=".9" rx="14"/><text x="0" y="-16" fill="#60a5fa" class="tagline" text-anchor="middle">⚡ AI AGENT MEMORY &amp; CONTEXT</text><text x="0" y="42" fill="url(#accent-grad)" class="title">Awesome AI Context &amp; Memory</text><text x="0" y="86" fill="url(#sub-grad)" class="subtitle">Curated Hub of Persistent State, Long-Term Memory &amp; Context Window Optimization</text></g><g><g class="badge-float" transform="translate(600, 245) translate(-460, 0)"><rect width="210" height