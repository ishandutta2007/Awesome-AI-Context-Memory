<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Dark gradient background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Header glow gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtitle gradient -->
    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        letter-spacing: 0.2px;
      }
      .tagline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
      
      /* Subtle animated pulse and flow in background */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-8px) scale(1.02); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.75; }
      }
      @keyframes streamFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbitCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      .floating-orb {
        animation: pulseGlow 4s ease-in-out infinite alternate;
      }
      .stream-line {
        stroke-dasharray: 10, 15;
        animation: streamFlow 5s linear infinite;
      }
      .badge-float {
        animation: orbitCard 4s ease-in-out infinite;
      }
      .badge-float-delayed {
        animation: orbitCard 4s ease-in-out infinite;
        animation-delay: 2s;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />
  
  <!-- Subtle Background Grid -->
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- DYNAMIC BACKGROUND ELEMENTS: Glowing ambient energy nodes -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow-cyan)" class="floating-orb" />
  <circle cx="1050" cy="180" r="180" fill="#a855f7" opacity="0.12" filter="url(#glow-purple)" class="floating-orb" />
  <circle cx="600" cy="330" r="160" fill="#6366f1" opacity="0.1" filter="url(#glow-cyan)" class="floating-orb" />

  <!-- DYNAMIC STREAM LINES (Representing Data & Context Streams across agents) -->
  <path d="M 50 180 Q 300 80, 600 180 T 1150 180" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.3" class="stream-line" />
  <path d="M 50 220 Q 350 320, 650 200 T 1150 220" fill="none" stroke="#c084fc" stroke-width="1.8" opacity="0.25" class="stream-line" style="animation-direction: reverse; animation-duration: 7s;" />

  <!-- Decorative Context Circuit Nodes in deep background -->
  <g opacity="0.4">
    <circle cx="100" cy="190" r="4" fill="#38bdf8" />
    <circle cx="280" cy="130" r="3" fill="#818cf8" />
    <circle cx="920" cy="150" r="3" fill="#c084fc" />
    <circle cx="1100" cy="210" r="4" fill="#38bdf8" />
  </g>

  <!-- FOREGROUND CONTENT: Header & Meta (Crisp and always above any visual effects) -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Super-tag / category badge -->
    <rect x="-140" y="-35" width="280" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.9" />
    <text x="0" y="-16" fill="#60a5fa" text-anchor="middle" class="tagline">⚡ AI AGENT MEMORY &amp; CONTEXT</text>

    <!-- Main Title -->
    <text x="0" y="42" fill="url(#accent-grad)" class="title">Awesome AI Context &amp; Memory</text>
    
    <!-- Subtitle -->
    <text x="0" y="86" fill="url(#sub-grad)" class="subtitle">Curated Hub of Persistent State, Long-Term Memory &amp; Context Window Optimization</text>
  </g>

  <!-- FOREGROUND FEATURE BADGES / PILLS (Evenly spaced in bottom foreground) -->
  <g transform="translate(600, 245)">
    <!-- Pill 1: Persistent Memory -->
    <g transform="translate(-460, 0)" class="badge-float">
      <rect x="0" y="0" width="210" height="48" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="24" cy="24" r="8" fill="#0284c7" />
      <circle cx="24" cy="24" r="4" fill="#38bdf8" />
      <text x="44" y="29" fill="#f1f5f9" class="pill-text">🧠 Persistent Memory</text>
    </g>

    <!-- Pill 2: Context Window Optimization -->
    <g transform="translate(-230, 0)" class="badge-float-delayed">
      <rect x="0" y="0" width="215" height="48" rx="12" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="24" cy="24" r="8" fill="#4f46e5" />
      <circle cx="24" cy="24" r="4" fill="#a5b4fc" />
      <text x="44" y="29" fill="#f1f5f9" class="pill-text">🗜️ Context Engineering</text>
    </g>

    <!-- Pill 3: Vector & Graph Stores -->
    <g transform="translate(5, 0)" class="badge-float">
      <rect x="0" y="0" width="220" height="48" rx="12" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.2" />
      <circle cx="24" cy="24" r="8" fill="#7e22ce" />
      <circle cx="24" cy="24" r="4" fill="#d8b4fe" />
      <text x="44" y="29" fill="#f1f5f9" class="pill-text">🌐 Vector &amp; Graph RAG</text>
    </g>

    <!-- Pill 4: Production Observability -->
    <g transform="translate(245, 0)" class="badge-float-delayed">
      <rect x="0" y="0" width="215" height="48" rx="12" fill="url(#card-grad)" stroke="#ec4899" stroke-width="1.2" />
      <circle cx="24" cy="24" r="8" fill="#be185d" />
      <circle cx="24" cy="24" r="4" fill="#f472b6" />
      <text x="44" y="29" fill="#f1f5f9" class="pill-text">📊 Agent Tracing &amp; Evals</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#accent-grad)" rx="2" />
</svg>
